<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create a free wedding invitation card. Enter your names and date, then download your card.">
<title>Free Wedding Invitation Card | English Template</title>
<link rel="canonical" href="https://videocard.in/free_eng.html">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f8f1e9;
        margin: 0;
        padding: 20px;
    }
    .back-btn {
        background-color: #E7D2A4;
        color: #5A4520;
        font-size: 28px;
        padding: 12px 16px;
        border-radius: 50%;
        cursor: pointer;
        border: none;
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 2;
    }
    .page-name {
        background-color: #EFE3C8;
        color: #2B2B2B;
        padding: 8px 24px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        text-align: center;
        margin: 0 auto 20px;
        width: fit-content;
    }
    .container {
        display: flex;
        gap: 40px;
        max-width: 1100px;
        margin: 0 auto;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
    }
    .canvas-wrapper { text-align: center; }
    canvas {
        background: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        border-radius: 12px;
        max-width: 100%;
        height: auto;
        width: 360px;
    }
    .hint {
        font-size: 13px;
        color: #666;
        margin-top: 8px;
    }
    .form {
        width: 360px;
        max-width: 100%;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        box-sizing: border-box;
    }
    h3 {
        margin-top: 0;
        color: #8B0000;
        text-align: center;
    }
    .offer-badge {
        display: block;
        text-align: center;
        background: #ff3b3b;
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        margin: 8px auto 0;
        width: fit-content;
    }
    .field {
        display: flex;
        align-items: center;
        margin-bottom: 14px;
    }
    .field input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
    }
    .limit {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        background: #f4a261;
        color: white;
        text-align: center;
        line-height: 38px;
        margin-left: 10px;
        border-radius: 50%;
        font-size: 13px;
        font-weight: bold;
    }
    button {
        padding: 14px 24px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }
    button.reset { background: #e76f51; color: white; }
    button.download { background: #2a9d8f; color: white; }
    .pdf-box {
        margin-top: 20px;
        font-size: 15px;
        background: #fff3cd;
        color: #856404;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #ffeeba;
        text-align: center;
    }
    .pdf-btn {
        display: inline-block;
        margin-top: 10px;
        background: #25D366;
        color: white;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
    }
    .pay-note {
        font-size: 13px;
        color: #555;
        margin-top: 8px;
    }
    @media (max-width: 768px) {
        canvas { width: 100%; max-width: 360px; }
        .form { width: 100%; }
    }
</style>
</head>
<body>

    <button class="back-btn" onclick="window.history.back()" aria-label="Back">&lt;</button>
    <div class="page-name" id="page-name"></div>

<div class="container">
    <div class="canvas-wrapper">
        <canvas id="canvas" width="540" height="960"></canvas>
        <div class="hint">On your phone, press and hold the card to save it</div>
    </div>

    <div class="form">
        <h3>
            After filling this form, you can download your free card image.
        </h3>
        <span class="offer-badge">Full PDF card, Rs. 155</span>

        <div class="field">
            <input id="f1" maxlength="25" placeholder="Bride Name" autocomplete="off">
            <div class="limit">25</div>
        </div>
        <div class="field">
            <input id="f2" maxlength="60" placeholder="Bride Parents" autocomplete="off">
            <div class="limit">60</div>
        </div>
        <div class="field">
            <input id="f3" maxlength="25" placeholder="Groom Name" autocomplete="off">
            <div class="limit">25</div>
        </div>
        <div class="field">
            <input id="f4" maxlength="60" placeholder="Groom Parents" autocomplete="off">
            <div class="limit">60</div>
        </div>
        <div class="field">
            <input id="f5" maxlength="20" placeholder="Date" autocomplete="off">
            <div class="limit">20</div>
        </div>
        <div class="field">
            <input id="f6" maxlength="15" placeholder="Time" autocomplete="off">
            <div class="limit">15</div>
        </div>
        <div class="field">
            <input id="f7" maxlength="65" placeholder="Venue Line 1" autocomplete="off">
            <div class="limit">65</div>
        </div>
        <div class="field">
            <input id="f8" maxlength="65" placeholder="Venue Line 2" autocomplete="off">
            <div class="limit">65</div>
        </div>
        <div class="field">
            <input type="tel" id="f9" maxlength="10" placeholder="Mobile" autocomplete="off">
            <div class="limit">10</div>
        </div>

        <div style="text-align: center; margin-top: 24px;">
            <button class="reset" onclick="resetForm()">Reset</button>
            <button class="download" onclick="downloadInvitation()">Download</button>
        </div>

        <div class="pdf-box">
            <div>Want the full card as a PDF?</div>
            <a class="pdf-btn" href="https://wa.me/9413451477?text=मुझे%20अपने%20कार्ड%20के%20लिए%20PDF%20बनवानी%20है" target="_blank" rel="noopener">
                📲 WhatsApp us for the Full PDF card
            </a>
            <div class="pay-note">The full PDF requires advance payment of the full amount.</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 540
const H = canvas.height;  // 960

// Sample key -> background file (files sit in the same folder as this page)
const SAMPLE_IMAGES = {
    'hin-1': 'h-1.webp',
    'hin-2': 'h-2.webp',
    'eng-1': 'e-1.webp',
    'eng-2': 'e-2.webp',
    // older keys still sent by previous links
    'hindi.webp': 'h-1.webp',
    'english.webp': 'e-1.webp'
};

const selectedKey = localStorage.getItem('selectedCardImage');
const imgSrc = SAMPLE_IMAGES[selectedKey] || 'e-1.webp';

// Text positions for the 540 x 960 canvas
const LAYOUT = {
    greet1:   { x: 270, y: 230, size: 18, weight: "normal" },
    greet2:   { x: 270, y: 258, size: 18, weight: "normal" },
    name1:    { x: 270, y: 326, size: 31, weight: "bold" },
    parents1: { x: 270, y: 369, size: 18, weight: "normal" },
    amp:      { x: 270, y: 429, size: 41, weight: "bold" },
    name2:    { x: 270, y: 486, size: 31, weight: "bold" },
    parents2: { x: 270, y: 529, size: 18, weight: "normal" },
    on:       { x: 270, y: 589, size: 17, weight: "bold" },
    date:     { x: 270, y: 630, size: 19, weight: "bold" },
    at:       { x: 221, y: 663, size: 19, weight: "bold" },
    time:     { x: 286, y: 663, size: 19, weight: "bold" },
    venueHead:{ x: 270, y: 730, size: 17, weight: "bold" },
    venue1:   { x: 270, y: 771, size: 18, weight: "normal" },
    venue2:   { x: 270, y: 801, size: 18, weight: "normal" },
    mobile:   { x: 270, y: 838, size: 18, weight: "normal" }
};

let imgLoaded = false;
const img = new Image();
img.onload = () => { imgLoaded = true; draw(); };
img.onerror = () => {
    console.error("Background image not found:", imgSrc);
    draw();
};
img.src = imgSrc;

// Draw text, shrinking the font if it would be wider than maxWidth
function drawFitted(text, pos, maxWidth) {
    if (!text) return;
    let size = pos.size;
    const font = (s) => `${pos.weight} ${s}px Georgia, serif`;
    ctx.font = font(size);
    while (ctx.measureText(text).width > maxWidth && size > 10) {
        size -= 1;
        ctx.font = font(size);
    }
    ctx.fillText(text, pos.x, pos.y);
}

function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    if (imgLoaded) ctx.drawImage(img, 0, 0, W, H);

    const v = (id) => document.getElementById(id).value.trim();
    const maxW = W - 80;

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#5C0000";
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    ctx.shadowBlur = 8;

    // Fixed wording
    if (imgLoaded) {
        drawFitted("We request the honor of your", LAYOUT.greet1, maxW);
        drawFitted("presence at the marriage of", LAYOUT.greet2, maxW);
        drawFitted("&", LAYOUT.amp, maxW);
        drawFitted("ON", LAYOUT.on, maxW);
        drawFitted("At", LAYOUT.at, maxW);
        drawFitted("VENUE", LAYOUT.venueHead, maxW);
    }

    // Customer details
    drawFitted(v("f1"), LAYOUT.name1, maxW);
    drawFitted(v("f2"), LAYOUT.parents1, maxW);
    drawFitted(v("f3"), LAYOUT.name2, maxW);
    drawFitted(v("f4"), LAYOUT.parents2, maxW);
    drawFitted(v("f5"), LAYOUT.date, maxW);
    drawFitted(v("f6"), LAYOUT.time, maxW);
    drawFitted(v("f7"), LAYOUT.venue1, maxW);
    drawFitted(v("f8"), LAYOUT.venue2, maxW);
    drawFitted(v("f9"), LAYOUT.mobile, maxW);

    // Bottom bar with promotion line
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(217, 169, 194, 0.9)";
    ctx.fillRect(0, H - 32, W, 32);
    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";
    ctx.textBaseline = "middle";
    ctx.fillText("On videocard.in, you can get cards with numerous designs.", W / 2, H - 16);

    ctx.restore();
    updateLimits();
}

// Redraw as the customer types
document.querySelectorAll("input").forEach(input => input.addEventListener("input", draw));

function resetForm() {
    document.querySelectorAll("input").forEach(input => { input.value = ""; });
    draw();
}

// One download action: saves the file directly, no extra window
function downloadInvitation() {
    canvas.toBlob(blob => {
        if (!blob) {
            alert("Download failed. Please try again.");
            return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "wedding-invitation.jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/jpeg", 0.95);
}

function updateLimits() {
    document.querySelectorAll(".field").forEach(field => {
        const input = field.querySelector("input");
        const badge = field.querySelector(".limit");
        badge.textContent = input.maxLength - input.value.length;
    });
}

document.addEventListener("DOMContentLoaded", () => {
    const last = localStorage.getItem('lastViewedPage');
    if (last) document.getElementById('page-name').innerText = last;
    updateLimits();
});
</script>

</body>
</html>
